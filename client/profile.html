<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій профіль | Бізнес Симулятор</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0b0c10;
            color: #c5c6c7;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-card, .business-card {
            background: #1f2833;
            padding: 20px 30px;
            border-radius: 8px;
            border: 1px solid #66fcf1;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.15);
        }

        .info-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-card h1, .business-card h2 {
            margin: 0 0 10px 0;
            color: #45a29e;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(69, 162, 158, 0.5);
        }

        .server-msg {
            color: #c5c6c7;
            margin: 0;
            font-size: 14px;
        }

        .balance-container {
            text-align: right;
        }

        .balance {
            font-size: 28px;
            font-weight: bold;
            color: #66fcf1;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.8);
            margin-bottom: 10px;
        }

        button {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-transform: uppercase;
        }

        .logout-btn {
            padding: 8px 16px;
            background-color: transparent;
            color: #ff007f;
            border: 1px solid #ff007f;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 5px rgba(255, 0, 127, 0.3);
        }

        .logout-btn:hover {
            background-color: #ff007f;
            color: #000;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
        }

        .business-card h2 {
            border-bottom: 1px solid #45a29e;
            padding-bottom: 10px;
        }

        .business-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            max-height: 500px;
            overflow-y: auto;
            padding: 10px;
            background-color: #0b0c10;
            border-radius: 8px;
            border: 1px solid #1f2833;
        }

        .biz-item {
            background: #121212;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #45a29e;
            box-shadow: 0 0 8px rgba(69, 162, 158, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .biz-item h3 {
            margin-top: 0;
            color: #66fcf1;
            text-transform: uppercase;
        }

        .biz-item p {
            margin: 5px 0;
            color: #c5c6c7;
            font-size: 14px;
        }

        .biz-item b {
            color: #fff;
        }

        /* ПРОГРЕСС-БАР */
        .progress-container {
            width: 100%;
            background-color: #0b0c10;
            border: 1px solid #45a29e;
            border-radius: 4px;
            height: 12px;
            margin: 8px 0;
            overflow: hidden;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }

        .progress-bar {
            height: 100%;
            background-color: #66fcf1;
            box-shadow: 0 0 10px #66fcf1;
            transition: width 0.5s ease-in-out;
        }

        /* Кнопки дій */
        .action-btn {
            margin-top: 5px;
            padding: 6px;
            background: transparent;
            border: 1px solid #66fcf1;
            color: #66fcf1;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
            width: 100%;
        }

        .action-btn:hover {
            background: #66fcf1;
            color: #000;
        }

        .action-btn.sell {
            border-color: #ffb400;
            color: #ffb400;
        }
        .action-btn.sell:hover { background: #ffb400; color: #000; box-shadow: 0 0 8px #ffb400; }

        .add-business-btn {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 150px;
            background: transparent;
            border: 2px dashed #45a29e;
            border-radius: 6px;
            color: #45a29e;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-business-btn .plus {
            font-size: 48px;
            line-height: 1;
        }

        .add-business-btn .price {
            font-size: 16px;
            margin-top: 10px;
            color: #66fcf1;
        }

        .add-business-btn:hover {
            background-color: rgba(69, 162, 158, 0.1);
            border-color: #66fcf1;
            color: #66fcf1;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.4);
        }

        .business-list::-webkit-scrollbar { width: 8px; }
        .business-list::-webkit-scrollbar-track { background: #0b0c10; }
        .business-list::-webkit-scrollbar-thumb { background: #45a29e; border-radius: 4px; }
        .business-list::-webkit-scrollbar-thumb:hover { background: #66fcf1; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="info-card">
        <div>
            <h1>Термінал управління</h1>
            <p class="server-msg"><span id="server_message">Встановлення з'єднання...</span></p>
        </div>
        <div class="balance-container">
            <div class="balance"><span id="money_display">...</span> $</div>
            <button class="logout-btn" onclick="logout()">Відключитися</button>
        </div>
    </div>

    <div class="business-card">
        <h2>Активи</h2>
        <div class="business-list" id="businesses_container">
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    const container = document.getElementById("businesses_container");

    if (!token) {
        window.location.href = "/login_page";
    } else {
        loadData();
    }

    function loadData() {
        fetch("/api/my-business", {
            method: "GET",
            headers: {
                "Authorization": "Bearer " + token
            }
        })
        .then(response => {
            if (response.status === 401) {
                logout();
            }
            return response.json();
        })
        .then(data => {
            document.getElementById("server_message").innerText = data.message;
            document.getElementById("money_display").innerText = data.money;

            let htmlContent = "";

            if (data.busisness && data.busisness.length > 0) {
                data.busisness.forEach(b => {
                    const productPercentage = Math.min((b.product / 100) * 100, 100);

                    htmlContent += `
                        <div class="biz-item">
                            <div>
                                <h3>${b.business_name}</h3>
                                <p>Рівень: <b>${b.lvl}</b></p>
                                <p>Сировина: <b>${b.warehouse} / 100</b></p>
                                <p>Товар: <b>${b.product} / 100</b></p>

                                <div class="progress-container">
                                    <div class="progress-bar" style="width: ${productPercentage}%;"></div>
                                </div>
                            </div>
                            <div style="margin-top: 15px; display: flex; flex-direction: column; gap: 5px;">
                                <button class="action-btn" onclick="buySupplies(${b.id})">Купити сировину</button>
                                <button class="action-btn" onclick="loadData()">Оновити стан</button>
                                <button class="action-btn sell" onclick="sellProduct(${b.id})">Продати товар</button>
                            </div>
                        </div>
                    `;
                });
            }

            htmlContent += `
                <button class="add-business-btn" onclick="createNewBusiness()">
                    <span class="plus">+</span>
                    <span class="price">Ціна: 500 $</span>
                </button>
            `;

            container.innerHTML = htmlContent;
        })
        .catch(error => {
            console.error("Помилка:", error);
            document.getElementById("server_message").innerText = "Помилка з'єднання з сервером";
        });
    }

    async function createNewBusiness() {
        const name = prompt("Введіть назву для вашого нового підприємства:");
        if (!name || name.trim() === "") return;

        try {
            const response = await fetch("/create_business", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({ name: name })
            });

            if (response.ok) {
                loadData();
            } else {
                const result = await response.json();
                alert("Помилка: " + (result.detail || "Не вдалося створити бізнес"));
            }
        } catch (error) {
            alert("Помилка з'єднання з сервером");
        }
    }

    async function buySupplies(businessId) {
        try {
            const response = await fetch("/buy_supplie", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({ id: businessId })
            });

            if (response.ok) {
                loadData();
            } else {
                const result = await response.json();
                alert("Помилка: " + (result.detail || "Не вдалося купити сировину"));
            }
        } catch (error) {
            alert("Помилка з'єднання з сервером");
        }
    }

    async function sellProduct(businessId) {
        try {
            const response = await fetch("/sell_product", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({ id: businessId })
            });

            if (response.ok) {
                loadData();
            } else {
                const result = await response.json();
                alert("Помилка: " + (result.detail || "Не вдалося продати товар"));
            }
        } catch (error) {
            alert("Помилка з'єднання з сервером");
        }
    }

    function logout() {
        localStorage.removeItem("access_token");
        window.location.href = "/login_page";
    }
    setInterval(loadData, 5000);
</script>
</script>

</body>
</html>
