<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій профіль | Бізнес Симулятор</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdf6e3;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* Головний контейнер, щоб все було по центру і не розтягувалося на весь екран */
        .dashboard {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Верхня картка з інформацією */
        .info-card {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-card h1 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 24px;
        }

        .server-msg {
            color: #666;
            margin: 0;
            font-size: 14px;
        }

        .balance-container {
            text-align: right;
        }

        .balance {
            font-size: 28px;
            font-weight: bold;
            color: #2ecc71; /* Зелений колір для грошей */
            margin-bottom: 10px;
        }

        .logout-btn {
            padding: 8px 16px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .logout-btn:hover { background-color: #ff6b81; }

        /* Нижня картка з бізнесами */
        .business-card {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .business-card h2 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #fdf6e3;
            padding-bottom: 10px;
        }

        /* Контейнер для скролу */
        .business-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            max-height: 400px; /* Висота, після якої з'явиться скрол */
            overflow-y: auto;  /* Вертикальна прокрутка */
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        /* Кнопка "Додати бізнес" (плюсик) */
        .add-business-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 120px;
            background: transparent;
            border: 2px dashed #ff9f43;
            border-radius: 8px;
            color: #ff9f43;
            font-size: 48px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-business-btn:hover {
            background-color: rgba(255, 159, 67, 0.1);
            transform: scale(1.02);
        }

        /* Кастомний дизайн скролбару (щоб було красиво у браузерах) */
        .business-list::-webkit-scrollbar {
            width: 8px;
        }
        .business-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 8px;
        }
        .business-list::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 8px;
        }
        .business-list::-webkit-scrollbar-thumb:hover {
            background: #ff9f43;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- Верхній блок: Інформація та Баланс -->
    <div class="info-card">
        <div>
            <h1>Панель управління</h1>
            <p class="server-msg"><span id="server_message">Завантаження даних з сервера...</span></p>
        </div>
        <div class="balance-container">
            <div class="balance"><span id="money_display">...</span> $</div>
            <button class="logout-btn" onclick="logout()">Вийти з акаунта</button>
        </div>
    </div>

    <!-- Нижній блок: Сітка бізнесів -->
    <div class="business-card">
        <h2>Мої бізнеси</h2>

        <div class="business-list" id="businesses_container">
            <!-- Тут у майбутньому JavaScript буде створювати картки бізнесів -->

            <!-- Кнопка купівлі/створення нового бізнесу (поки нічого не робить) -->
            <button class="add-business-btn" onclick="alert('Функція купівлі бізнесу ще в розробці!')" title="Придбати новий бізнес">
                +
            </button>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    const container = document.getElementById("businesses_container");

    if (!token) {
        window.location.href = "/";
    } else {
        loadData();
    }

    // Вынесли загрузку данных в отдельную функцию, чтобы было удобнее
    function loadData() {
        fetch("/api/my-business", {
            method: "GET",
            headers: {
                "Authorization": "Bearer " + token
            }
        })
        .then(response => {
            if (response.status === 401) {
                logout();
            }
            return response.json();
        })
        .then(data => {
            document.getElementById("server_message").innerText = data.message;
            document.getElementById("money_display").innerText = data.money;

            // Очищаем контейнер перед отрисовкой
            let htmlContent = "";

            // Перебираем массив бизнесов и создаем HTML-карточку для каждого
            if (data.busisness && data.busisness.length > 0) {
                data.busisness.forEach(b => {
                    htmlContent += `
                        <div style="background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                            <h3 style="margin-top: 0; color: #333;">${b.business_name}</h3>
                            <p style="margin: 5px 0; color: #666; font-size: 14px;">Рівень: <b>${b.lvl}</b></p>
                            <p style="margin: 5px 0; color: #666; font-size: 14px;">Склад: <b>${b.warehouse}</b></p>
                            <p style="margin: 5px 0; color: #666; font-size: 14px;">Продукт: <b>${b.product}</b></p>
                        </div>
                    `;
                });
            }

            // В конце всегда добавляем кнопку-плюсик
            htmlContent += `
                <button class="add-business-btn" onclick="createNewBusiness()" title="Придбати новий бізнес">
                    +
                </button>
            `;

            container.innerHTML = htmlContent;
        })
        .catch(error => {
            console.error("Помилка:", error);
            document.getElementById("server_message").innerText = "Помилка з'єднання з сервером";
        });
    }

    // Функция создания нового бизнеса
    async function createNewBusiness() {
        // Запрашиваем название у пользователя
        const name = prompt("Введіть назву для вашого нового підприємства:");

        // Если юзер нажал "Отмена" или ввел пустоту – ничего не делаем
        if (!name || name.trim() === "") return;

        try {
            const response = await fetch("/create_business", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({ name: name })
            });

            if (response.ok) {
                // Если успешно создали – просто заново загружаем данные (карточка появится сама)
                loadData();
            } else {
                alert("Виникла помилка при створенні бізнесу!");
            }
        } catch (error) {
            alert("Помилка з'єднання з сервером");
        }
    }

    function logout() {
        localStorage.removeItem("access_token");
        window.location.href = "/";
    }
</script>

</body>
</html>
