<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База гравців | Бізнес Симулятор</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0b0c10;
            color: #c5c6c7;
            padding: 40px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            color: #45a29e;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(69, 162, 158, 0.5);
            margin-bottom: 30px;
        }
        table {
            width: 100%; max-width: 800px; border-collapse: collapse;
            background: #1f2833; border-radius: 8px; overflow: hidden;
            box-shadow: 0 0 15px rgba(69, 162, 158, 0.15);
            border: 1px solid #45a29e;
        }
        th, td {
            padding: 15px; text-align: left;
            border-bottom: 1px solid #121212;
        }
        th {
            background-color: #121212;
            color: #66fcf1;
            text-transform: uppercase;
            border-bottom: 2px solid #45a29e;
        }
        tr { transition: background-color 0.2s; }
        tr:hover { background-color: rgba(69, 162, 158, 0.1); }
        td { color: #c5c6c7; }

        #statusMessage {
            margin-top: 20px;
            color: #45a29e;
            font-weight: bold;
        }
        .error {
            color: #ff007f !important;
            text-shadow: 0 0 5px rgba(255, 0, 127, 0.5);
        }
    </style>
</head>
<body>

<h2>Зареєстровані користувачі (БД)</h2>
<table id="usersTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>Нікнейм</th>
            <th>Email</th>
            <th>Пароль (Хеш)</th>
        </tr>
    </thead>
    <tbody>
        <!-- Данные будут загружены сюда через JS -->
    </tbody>
</table>
<p id="statusMessage">Отримання даних з серверу...</p>

<script>
    async function loadUsers() {
        const tbody = document.querySelector('#usersTable tbody');
        const statusMessage = document.getElementById('statusMessage');

        try {
            const response = await fetch('http://127.0.0.1:8000/users');
            if (!response.ok) throw new Error("Не вдалося завантажити дані");

            const users = await response.json();
            statusMessage.style.display = 'none';

            users.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${user.id}</td>
                    <td><b style="color: #66fcf1;">${user.nickname || user.nikname}</b></td>
                    <td>${user.email}</td>
                    <td style="font-size: 12px; color: #666;">${user.password}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            statusMessage.className = 'error';
            statusMessage.innerText = "Помилка підключення до сервера. Переконайтеся, що uvicorn запущено.";
        }
    }

    loadUsers();
</script>

</body>
</html>
