<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід | Бізнес Симулятор</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0b0c10;
            color: #c5c6c7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1f2833;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #66fcf1;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.15);
            width: 100%;
            max-width: 350px;
        }
        h2 {
            text-align: center;
            color: #45a29e;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(69, 162, 158, 0.5);
            margin-top: 0;
        }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #45a29e; font-size: 14px; text-transform: uppercase; }
        input {
            width: 100%; padding: 10px; box-sizing: border-box;
            background: #121212; border: 1px solid #45a29e; border-radius: 4px;
            color: #66fcf1; font-family: 'Courier New', Courier, monospace; font-size: 14px;
            outline: none; transition: 0.3s;
        }
        input:focus {
            border-color: #66fcf1;
            box-shadow: 0 0 8px rgba(102, 252, 241, 0.5);
        }
        button {
            width: 100%; padding: 10px; background-color: transparent;
            color: #66fcf1; border: 1px solid #66fcf1; border-radius: 4px; font-size: 16px;
            cursor: pointer; transition: all 0.3s; font-family: 'Courier New', Courier, monospace;
            font-weight: bold; text-transform: uppercase; margin-top: 10px;
        }
        button:hover {
            background-color: #66fcf1;
            color: #000;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.8);
        }
        #message { margin-top: 15px; text-align: center; font-size: 14px; font-weight: bold; }
        .switch-link {
            display: block; text-align: center; margin-top: 20px; color: #c5c6c7;
            text-decoration: none; font-size: 12px; transition: 0.2s;
        }
        .switch-link:hover { color: #66fcf1; text-shadow: 0 0 5px rgba(102, 252, 241, 0.5); }
    </style>
</head>
<body>

<div class="card">
    <h2>Авторизація</h2>
    <form id="loginForm">
        <div class="input-group">
            <label for="nickname">Нікнейм</label>
            <input type="text" id="nickname" required>
        </div>
        <div class="input-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit">Увійти</button>
    </form>
    <div id="message"></div>

    <a href="/" class="switch-link">Немає аккаунту? Створити новий</a>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const nickname = document.getElementById('nickname').value;
        const password = document.getElementById('password').value;
        const messageDiv = document.getElementById('message');

        try {
            const response = await fetch('http://127.0.0.1:8000/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nickname, password })
            });

            const result = await response.json();

            if (response.ok) {
                messageDiv.style.color = '#66fcf1';
                messageDiv.style.textShadow = '0 0 5px rgba(102, 252, 241, 0.5)';
                messageDiv.innerText = "Доступ дозволено! Завантаження профілю...";

                localStorage.setItem("access_token", result.access_token);

                setTimeout(() => {
                    window.location.href = "/profile";
                }, 1000);

            } else {
                messageDiv.style.color = '#ff007f';
                messageDiv.style.textShadow = '0 0 5px rgba(255, 0, 127, 0.5)';
                messageDiv.innerText = "Помилка: " + (result.detail || "Невірні дані");
            }
        } catch (error) {
            messageDiv.style.color = '#ff007f';
            messageDiv.innerText = "Помилка з'єднання з сервером.";
        }
    });
</script>

</body>
</html>
